<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>operable fixture</title><style>body{margin:24px;font:14px/20px Arial,sans-serif;color:#222;background:#fff}p{margin:10px 0}button{font:inherit;padding:6px 10px;border:1px solid #666;border-radius:6px;background:#fff;color:#222}:focus-visible{outline:3px solid #06c;outline-offset:2px}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes drift{to{transform:translateX(40px)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes glow{50%{opacity:.5}}.box{width:120px;height:24px;background:#dde}#drifter{animation:drift 1s ease-in-out infinite alternate}#slide,#slide2{transition:transform .3s}#slide:hover,#slide2:hover{transform:translateX(4px)}</style></head><body>
<p>Words that are always here.</p>
<div id="drifter" class="box"></div>
<button id="slide">Slides on hover</button>
<button id="slide2">Slides the same way</button>
</body></html>
