<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>layout fixture</title><style>body{margin:24px;font:14px/20px Arial,sans-serif;color:#222;background:#fff}button{font:inherit;border:0;border-radius:6px;background:#0f5132;color:#fff}.card{background:#f3f2ee;border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.08);width:320px}ul{list-style:none;margin:0;padding:0}svg{width:16px;height:16px;vertical-align:middle}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-200px)}}.ticker{animation:slide 20s linear infinite}</style></head><body>
<!-- a ticker moves its words through the box: not judged while it moves, and the run says so -->
<div class="ticker" style="width:160px;overflow:hidden;white-space:nowrap">Markets open higher as the quarter closes on record volume</div>
</body></html>
