<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>rtl-overflow: bad</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; }
  /* Wider than its room once the margin is counted. Left to right the browser drops the right
     margin and the card fits; mirrored it drops the left one, keeps this, and the card leaves
     the frame on the left. */
  .card { width: 640px; margin-right: 160px; }
  .card p { margin: 0; }
  .card button { display: block; width: 100%; height: 44px; }
  /* Mirrored, this link is pushed 900 px to the right: all of it is gone, and all of it is 120 px. */
  .far { position: relative; }
  [dir="rtl"] .far { left: 900px; }
  .far a { display: block; width: 120px; }
</style>
</head>
<body>
  <main>
    <div class="card"><p id="copy">Your balance is ready to view.</p><button id="go" type="button">Open the statement</button></div>
    <div class="far"><a id="far" href="#help">Get help</a></div>
  </main>
</body>
</html>
